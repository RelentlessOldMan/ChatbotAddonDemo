# Builds everything and runs the free tests on each push and pull request.
# Never runs the paid live tests (DEMO_LIVE_TESTS is not set, and no keys are available here)
# or the desktop UI tests (they need an interactive Windows session).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ChatbotAddonDemo.sln -c Release

      - name: Test
        shell: pwsh
        run: |
          $failed = 0
          foreach ($project in 'Domain', 'Capabilities', 'Ai', 'Cli', 'Paths') {
            dotnet test "tests/Demo.$project.Tests" -c Release --no-build
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          exit $failed
